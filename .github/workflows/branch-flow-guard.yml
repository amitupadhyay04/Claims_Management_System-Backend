name: Branch Flow Guard

on:
  pull_request:
    branches:
      - uat
      - staging
      - prod
    types:
      - opened
      - reopened
      - synchronize

jobs:
  enforce-flow:
    name: Enforce Branch Promotion Flow
    runs-on: ubuntu-latest
    steps:
      - name: Check PR direction
        run: |
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"

          echo "================================================"
          echo "  PR Raised : ${SOURCE} → ${TARGET}"
          echo "  Allowed   : UAT → Staging → Prod (one-way)"
          echo "================================================"

          if [[ "$TARGET" == "uat" && "$SOURCE" == "staging" ]]; then
            echo "❌ BLOCKED: staging → uat is not allowed."
            exit 1
          fi

          if [[ "$TARGET" == "uat" && "$SOURCE" == "prod" ]]; then
            echo "❌ BLOCKED: prod → uat is not allowed."
            exit 1
          fi

          if [[ "$TARGET" == "staging" && "$SOURCE" == "prod" ]]; then
            echo "❌ BLOCKED: prod → staging is not allowed."
            exit 1
          fi

          if [[ "$TARGET" == "staging" && "$SOURCE" != "uat" ]]; then
            echo "❌ BLOCKED: '${SOURCE}' → staging is not allowed."
            exit 1
          fi

          if [[ "$TARGET" == "prod" && "$SOURCE" != "staging" ]]; then
            echo "❌ BLOCKED: '${SOURCE}' → prod is not allowed."
            exit 1
          fi

          echo "✅ PASSED: '${SOURCE}' → '${TARGET}' is valid."

      # ← ADD THIS NEW STEP
      - name: Auto close invalid PR
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `❌ **PR Blocked — Invalid Branch Flow**\n\nThis PR was automatically closed because it violates the branch promotion policy.\n\n**Allowed flow only:** \`feature/*\` → \`uat\` → \`staging\` → \`prod\`\n\nReverse merges are not permitted.`
            });
